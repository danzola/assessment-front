<div class="form-container" *ngIf="searchVisible">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody class="product-table">
            <tr *ngFor="let product of products" (click)="selectProduct(product)">
                <td>{{ product.name }}</td>
                <td>{{ product.price }}</td>
            </tr>
        </tbody>
    </table>
</div>
